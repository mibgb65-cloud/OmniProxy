version: '3'

vars:
  APP_NAME: "omniproxy"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  # ---------------------------------------------------------------------------
  # Wails platform tasks (generated by `wails3 init`)
  # ---------------------------------------------------------------------------
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  # ---------------------------------------------------------------------------
  # OmniProxy unified development commands
  # See docs/development/BUILD.md for the full workflow.
  # ---------------------------------------------------------------------------
  setup:
    summary: One-time setup - frontend dependencies, Go modules, lint tools
    cmds:
      - task: common:install:frontend:deps
      - go mod download
      - go install honnef.co/go/tools/cmd/staticcheck@latest

  format:
    summary: Formats all Go and frontend code
    cmds:
      - gofmt -w main.go internal
      - task: frontend:format

  format:check:
    summary: Verifies formatting without writing changes
    cmds:
      - |
        unformatted="$(gofmt -l main.go internal)"
        if [ -n "$unformatted" ]; then
          echo "gofmt: these files need formatting:"
          echo "$unformatted"
          exit 1
        fi
      - task: frontend:format:check

  lint:
    summary: Lints Go and frontend code (requires `task setup`)
    cmds:
      - go vet . ./internal/...
      - staticcheck . ./internal/...
      - task: frontend:lint

  typecheck:
    summary: Type-checks the frontend (Go is type-checked by the compiler)
    cmds:
      - task: frontend:typecheck

  test:
    summary: Runs Go and frontend tests
    cmds:
      - go test . ./internal/...
      - task: frontend:test

  verify:
    summary: Full quality gate - format check, lint, typecheck, test, build
    cmds:
      - task: format:check
      - task: lint
      - task: typecheck
      - task: test
      - task: build

  clean:
    summary: Removes build artifacts (keeps committed bindings and migrations)
    cmds:
      - rm -rf bin frontend/dist

  # ---------------------------------------------------------------------------
  # Frontend helpers (thin wrappers around pnpm scripts in frontend/)
  # ---------------------------------------------------------------------------
  frontend:format:
    summary: Formats the frontend with Prettier
    dir: frontend
    cmds:
      - pnpm format

  frontend:format:check:
    summary: Checks frontend formatting
    dir: frontend
    cmds:
      - pnpm format:check

  frontend:lint:
    summary: Lints the frontend with ESLint
    dir: frontend
    cmds:
      - pnpm lint

  frontend:typecheck:
    summary: Type-checks the frontend
    dir: frontend
    cmds:
      - pnpm typecheck

  frontend:test:
    summary: Runs frontend tests with Vitest
    dir: frontend
    cmds:
      - pnpm test
