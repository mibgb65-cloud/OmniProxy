name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      unsigned_artifact_id: ${{ steps.unsigned.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate tag
        id: version
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:REQUESTED_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid version tag' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($tag.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install build tools
        run: |
          npm install -g pnpm@12.6.0
          if ($LASTEXITCODE -ne 0) { throw 'pnpm setup failed' }
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          if ($LASTEXITCODE -ne 0) { throw 'Task setup failed' }
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          if ($LASTEXITCODE -ne 0) { throw 'staticcheck setup failed' }
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.30
          if ($LASTEXITCODE -ne 0) { throw 'Wails setup failed' }
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS setup failed' }
          "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH
      - name: Apply reviewed timing test correction for existing beta tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag == 'v2.0.0-beta.1'
        env:
          TEST_FIX_REF: ${{ github.workflow_sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $fix = $env:TEST_FIX_REF
          if ($fix -notmatch '^[0-9a-f]{40}$') { throw 'Invalid test correction ref' }
          git fetch --no-tags --depth=1 origin $fix
          if ($LASTEXITCODE -ne 0) { throw 'Test correction fetch failed' }
          $test = 'frontend/src/features/providers/providers-view.test.tsx'
          # 已共享标签保持不变；仅补入确定性测试，禁止控制提交改变应用源码。
          $unexpected = @(git diff --name-only $env:RELEASE_TAG $fix -- . ':(exclude)docs/**' ':(exclude).github/workflows/**' ":(exclude)$test")
          if ($LASTEXITCODE -ne 0 -or $unexpected.Count -ne 0) { throw 'Application source differs from release tag' }
          git restore --source $fix --worktree -- $test
          if ($LASTEXITCODE -ne 0) { throw 'Test correction restore failed' }
          $changes = @(git diff --name-only)
          if ($LASTEXITCODE -ne 0 -or @($changes | Where-Object { $_ -ne $test }).Count -ne 0) { throw 'Unexpected release workspace changes' }
      - name: Build and verify release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: ./scripts/build-release.ps1 -Version $env:RELEASE_TAG
      - name: Test signature gate with unsigned build fixture
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: ./scripts/test-release-signature.ps1 -Version $env:RELEASE_TAG -Installer "release-assets/OmniProxy-Setup-$($env:RELEASE_TAG)-windows-amd64.exe"
      - id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-unsigned
          # 签名配置只接收自有安装器，不提交校验文件或第三方运行时。
          path: release-assets/*.exe
          if-no-files-found: error
          retention-days: 14

  sign:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - name: Check required signing configuration
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $required = @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required signing configuration is missing: $name. No unsigned release will be published."
            }
          }
      - name: Submit signing request and wait for authorized approval
        id: signpath
        # 官方 v2 固定修订；审批由 SignPath 策略执行，不提供跳过审批或未签名回退。
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.unsigned_artifact_id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-release
      - name: Verify signed installer and regenerate SHA256
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: ./scripts/verify-release-signature.ps1 -Version $env:RELEASE_TAG -AssetDirectory signed-release -WriteChecksum
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-signed
          path: signed-release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, sign]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-signed
          path: release-assets
      - name: Reverify signature and checksum before publishing
        run: ./scripts/verify-release-signature.ps1 -Version $env:RELEASE_TAG -AssetDirectory release-assets
      - name: Publish complete release
        run: |
          $tag = $env:RELEASE_TAG
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to replace an already published release' }
          } else {
            gh release create $tag --verify-tag --draft --title "OmniProxy $tag" --notes-file "docs/releases/$tag.md" --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
          }
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object { $_.FullName })
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed' }
          $remote = gh release view $tag --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $remote.assets.Count -ne 2) { throw 'Remote asset verification failed' }
          foreach ($asset in $remote.assets) {
            $local = Get-Item -LiteralPath (Join-Path release-assets $asset.name)
            if ($local.Length -ne $asset.size) { throw 'Remote asset size mismatch' }
          }
          $pre = $env:IS_PRERELEASE
          $latest = if ($pre -eq 'true') { 'false' } else { 'true' }
          gh release edit $tag --draft=false "--prerelease=$pre" "--latest=$latest"
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
